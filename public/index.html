<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentations</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Presentations</h1>
            <button id="open-upload-modal" class="btn primary">Upload</button>
        </div>
    </header>

    <main>

    <!-- Filter Bar -->
    <div class="filters" style="margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
        <select id="filter-class" class="form-group" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; min-width: 150px;">
            <option value="">All Classes</option>
        </select>
        <select id="filter-subject" class="form-group" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd; min-width: 150px;">
            <option value="">All Subjects</option>
        </select>
    </div>

    <div class="grid" id="presentations-grid">
        <!-- Presentations will be loaded here -->
    </div>
    </main>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-upload">&times;</span>
            <h2>Upload Presentation</h2>
            <form id="upload-form">
                <div class="form-group">
                    <label for="className">Class (e.g. Grade 10)</label>
                    <input type="text" id="className" name="className" list="class-list" required placeholder="Type or select class">
                    <datalist id="class-list"></datalist>
                </div>
                <div class="form-group">
                    <label for="subjectName">Subject (e.g. Science)</label>
                    <input type="text" id="subjectName" name="subjectName" list="subject-list" required placeholder="Type or select subject">
                    <datalist id="subject-list"></datalist>
                </div>
                <div class="form-group">
                    <label for="secretCode">Secret Code</label>
                    <input type="password" id="secretCode" name="secretCode" required placeholder="Enter secret code">
                </div>
                <div class="form-group">
                    <label for="presentation">File (PDF/PPT)</label>
                    <input type="file" id="presentation" name="presentation" accept=".pdf,.ppt,.pptx" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn primary" id="upload-btn">Upload</button>
                </div>
                <div id="upload-message"></div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-delete">&times;</span>
            <h2>Delete Presentation</h2>
            <p>Are you sure you want to delete <strong id="delete-filename"></strong>?</p>
            <form id="delete-form">
                <div class="form-group" style="margin-top: 1rem;">
                    <label for="deleteSecretCode">Secret Code</label>
                    <input type="password" id="deleteSecretCode" required placeholder="Enter secret code to confirm">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn" style="background: #dc3545; color: white;" id="delete-btn">Delete Permanently</button>
                </div>
                <div id="delete-message"></div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script type="module" src="/app.js"></script>
</body>
</html>
