<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentation Viewer</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #222; }
        .viewer-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        
        .viewer-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }
        
        /* Default Header (Normal View) */
        .viewer-header {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            box-sizing: border-box;
            transition: transform 0.3s ease-in-out;
        }

        /* Hover zone is disabled in normal view */
        .hover-zone {
            display: none;
        }

        /* FULLSCREEN STATE */
        .viewer-container.is-fullscreen .viewer-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            transform: translateY(-100%);
        }

        .viewer-container.is-fullscreen .hover-zone {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            z-index: 40;
        }

        .viewer-container.is-fullscreen .hover-zone:hover + .viewer-header,
        .viewer-container.is-fullscreen .viewer-header:hover {
            transform: translateY(0);
        }

        #viewer-content {
            flex-grow: 1;
            min-height: 0; /* Fixes flex child percentage height bug */
            position: relative;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .viewer-frame {
            border: none;
            width: 100%;
            height: 100%;
        }
        #pptx-container {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000;
        }
        /* Style the children of pptx-container to be absolute and hidden by default */
        #pptx-container > div {
            display: none !important;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 100%;
            max-height: 100%;
        }
        #pptx-container > div.active-slide {
            display: block !important;
        }
        #loading-text {
            color: white;
            font-size: 1.5rem;
            position: absolute;
            z-index: 20;
        }
        /* Navigation Controls */
        .nav-controls {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 100;
            gap: 15px;
            align-items: center;
        }
        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 0 10px;
        }
        .nav-btn:hover { color: #00c4cc; }
        #slide-counter { color: white; font-family: sans-serif; font-size: 1.1rem; min-width: 60px; text-align: center; }
    </style>
</head>
<body>
    <div class="viewer-container">
        <div class="hover-zone"></div>
        <div class="viewer-header">
            <h2 id="presentation-title">Loading...</h2>
            <div>
                <button class="btn primary" id="fullscreen-btn">Full Screen</button>
                <a href="/" class="btn" style="background: #444; color: white;">Back</a>
            </div>
        </div>
        <div id="viewer-content">
            <div id="loading-text">Loading presentation...</div>
            <div id="pptx-container" style="display: none;"></div>
            
            <div class="nav-controls" id="nav-controls">
                <button class="nav-btn" id="prev-btn">&#8592;</button>
                <span id="slide-counter">1 / 1</span>
                <button class="nav-btn" id="next-btn">&#8594;</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { PptxViewer, RECOMMENDED_ZIP_LIMITS } from 'https://cdn.jsdelivr.net/npm/@aiden0z/pptx-renderer/+esm';

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUrl = urlParams.get('file');
            const viewerContent = document.getElementById('viewer-content');
            const pptxContainer = document.getElementById('pptx-container');
            const loadingText = document.getElementById('loading-text');
            const navControls = document.getElementById('nav-controls');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const slideCounter = document.getElementById('slide-counter');
            
            let currentSlideIndex = 0;
            let totalSlides = 0;
            let pptxSlides = [];
            let pdfDoc = null;
            let isPdfMode = false;
            
            if (!fileUrl) {
                loadingText.textContent = 'No file specified';
                return;
            }

            const filename = decodeURIComponent(fileUrl).split('/').pop().replace(/^\d+-/, '');
            document.getElementById('presentation-title').textContent = filename;

            const isPdf = fileUrl.toLowerCase().endsWith('.pdf');

            // --- Navigation Logic ---
            function nextSlide() {
                if (currentSlideIndex < totalSlides - 1) {
                    currentSlideIndex++;
                    updateSlideVisibility();
                }
            }

            function prevSlide() {
                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    updateSlideVisibility();
                }
            }

            function updateSlideVisibility() {
                slideCounter.textContent = `${currentSlideIndex + 1} / ${totalSlides}`;
                
                if (isPdfMode && pdfDoc) {
                    renderPdfPage(currentSlideIndex + 1);
                } else if (pptxSlides.length > 0) {
                    pptxSlides.forEach((slide, index) => {
                        if (index === currentSlideIndex) {
                            slide.classList.add('active-slide');
                        } else {
                            slide.classList.remove('active-slide');
                        }
                    });
                }
            }

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);

            // --- Rendering Logic ---
            if (isPdf) {
                isPdfMode = true;
                
                // Load PDF.js via dynamic script
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                document.head.appendChild(script);
                
                script.onload = () => {
                    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                    
                    // Create canvas for rendering
                    const canvas = document.createElement('canvas');
                    canvas.id = 'pdf-render-target';
                    canvas.style.maxWidth = '100%';
                    canvas.style.maxHeight = '100%';
                    canvas.style.objectFit = 'contain';
                    viewerContent.appendChild(canvas);

                    const loadingTask = pdfjsLib.getDocument(fileUrl);
                    loadingTask.promise.then(pdf => {
                        pdfDoc = pdf;
                        totalSlides = pdf.numPages;
                        
                        loadingText.style.display = 'none';
                        if (totalSlides > 0) {
                            navControls.style.display = 'flex';
                            updateSlideVisibility();
                        }
                    }).catch(error => {
                        loadingText.textContent = 'Failed to load PDF: ' + error.message;
                    });
                };
            } else {
                try {
                    const response = await fetch(fileUrl);
                    if (!response.ok) throw new Error('Failed to download PPTX');
                    
                    const arrayBuffer = await response.arrayBuffer();
                    
                    loadingText.style.display = 'none';
                    pptxContainer.style.display = 'block';

                    const viewer = await PptxViewer.open(arrayBuffer, pptxContainer, { 
                        zipLimits: RECOMMENDED_ZIP_LIMITS
                    });
                    
                    pptxSlides = Array.from(pptxContainer.children);
                    totalSlides = pptxSlides.length;
                    
                    if (totalSlides > 0) {
                        navControls.style.display = 'flex';
                        updateSlideVisibility();
                    }
                } catch (error) {
                    console.error('Error rendering PPTX:', error);
                    loadingText.textContent = 'Failed to load presentation: ' + error.message;
                    loadingText.style.display = 'block';
                    pptxContainer.style.display = 'none';
                }
            }

            // PDF render function
            let renderTask = null;
            function renderPdfPage(pageNum) {
                const canvas = document.getElementById('pdf-render-target');
                const ctx = canvas.getContext('2d');
                
                pdfDoc.getPage(pageNum).then(page => {
                    // Render at high resolution for crispness, CSS handles scaling to fit screen
                    const viewport = page.getViewport({ scale: 2 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    if (renderTask) {
                        renderTask.cancel();
                    }
                    
                    renderTask = page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    });
                });
            }

            // Fullscreen logic
            const container = document.querySelector('.viewer-container');
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    container.requestFullscreen().catch(err => {
                        console.error(`Error attempting to enable fullscreen: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    container.classList.add('is-fullscreen');
                } else {
                    container.classList.remove('is-fullscreen');
                }
            });
        });
    </script>
</body>
</html>
